name: Publish Creative Archive

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - CreativeArchive-Pages.zip
      - .github/workflows/pages.yml

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: read
    steps:
      - uses: actions/checkout@v6
      - uses: actions/configure-pages@v5
      - name: Extract site
        run: |
          unzip -q CreativeArchive-Pages.zip -d site || [ "$?" -eq 1 ]
          test -f site/index.html
          test -f site/archive-worker.js
          test -f site/pdfjs/pdf.min.mjs
      - uses: actions/upload-pages-artifact@v5.0.0
        with:
          path: site

  deploy:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5.0.1
