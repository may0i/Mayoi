name: Publish Creative Archive

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - CreativeArchive-Pages.zip
      - .github/workflows/pages.yml

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/configure-pages@v5
      - name: Extract site
        run: |
          unzip -q CreativeArchive-Pages.zip -d site || [ "$?" -eq 1 ]
          test -f site/index.html
          test -f site/archive-worker.js
          test -f site/pdfjs/pdf.min.mjs
      - uses: actions/upload-pages-artifact@v4
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
